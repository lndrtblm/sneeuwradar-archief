name: Radar-archief

on:
  schedule:
    - cron: "23 * * * *"     # elk uur
  workflow_dispatch:          # handmatig starten kan ook

permissions:
  contents: write

concurrency:
  group: radar-archief
  cancel-in-progress: false

jobs:
  archief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow installeren
        run: pip install pillow==10.4.0

      - name: Bestaand archief ophalen
        run: |
          git clone --depth 1 --branch archive "https://github.com/${GITHUB_REPOSITORY}.git" data || mkdir -p data
          rm -rf data/.git

      - name: Nieuwe kaarten toevoegen
        run: python archief.py data

      - name: Sneeuwbronnen ophalen (voor de sneeuwhoogtes in de app)
        run: |
          mkdir -p data/bron
          while read naam url; do
            if curl -fsSL --max-time 30 --retry 4 --retry-all-errors --retry-delay 10 -A "Mozilla/5.0 (compatible; sneeuwradar-archief/1.0)" "$url" -o "data/bron/$naam.tmp"; then
              mv "data/bron/$naam.tmp" "data/bron/$naam.html"
            else
              echo "mislukt: $naam (oude versie blijft staan)"; rm -f "data/bron/$naam.tmp"
            fi
          done <<'EOF'
          lumiplan https://bulletin.lumiplan.pro/bulletin.php?station=sybelles&region=alpes&pays=france&lang=fr
          skiresort https://www.skiresort.info/ski-resort/les-sybelles-le-corbier-la-toussuire-les-bottieres-st-sorlin-st-jean-darves/snow-report/
          snowforecast https://www.snow-forecast.com/resorts/Le-Corbier/6day/top
          skipass https://www.skipass.com/neige/le-corbier.html
          EOF

      - name: Archief opslaan (zonder oude geschiedenis, zodat de repository klein blijft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q -b archive
          git config user.name "radar-archief"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Archief bijgewerkt $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" archive

      - name: Planning actief houden
        # GitHub zet geplande taken uit na 60 dagen zonder activiteit; eens per maand een kleine wijziging
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "00" ]; then
            date -u > laatst-actief.txt
            git config user.name "radar-archief"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add laatst-actief.txt
            git commit -q -m "Planning actief houden"
            git push -q
          fi
